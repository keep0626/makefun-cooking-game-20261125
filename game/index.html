<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Ladle Bistro — a cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241608; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 160vh); height: min(100vh, 62.5vw); display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Golden Ladle Bistro: a cooking game. Move with WASD or arrow keys, press E to use counters, serve orders before their patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
